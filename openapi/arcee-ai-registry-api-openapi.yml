openapi: 3.2.0
info:
  title: AFM Registry API
  version: 0.1.0
tags:
- name: Registry
paths:
  /app/v1/tokenizer-artifacts:
    get:
      tags:
      - Registry
      summary: List Tokenizer Artifacts
      operationId: list_tokenizer_artifacts_app_v1_tokenizer_artifacts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TokenizerArtifactResponse'
                type: array
                title: Response List Tokenizer Artifacts App V1 Tokenizer Artifacts Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - Registry
      summary: Create Tokenizer Artifact
      description: Mirror and validate a Hugging Face tokenizer before a model is enabled.
      operationId: create_tokenizer_artifact_app_v1_tokenizer_artifacts_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenizerArtifactCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizerArtifactResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /app/v1/model-tokenizer-assignments:
    get:
      tags:
      - Registry
      summary: List Model Tokenizer Assignments
      operationId: list_model_tokenizer_assignments_app_v1_model_tokenizer_assignments_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ModelTokenizerAssignmentResponse'
                type: array
                title: Response List Model Tokenizer Assignments App V1 Model Tokenizer Assignments Get
      security:
      - HTTPBearer: []
    put:
      tags:
      - Registry
      summary: Assign Model Tokenizer
      operationId: assign_model_tokenizer_app_v1_model_tokenizer_assignments_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelTokenizerAssignmentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ModelTokenizerAssignmentResponse'
                - type: 'null'
                title: Response Assign Model Tokenizer App V1 Model Tokenizer Assignments Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /app/v1/models/discover:
    post:
      tags:
      - Registry
      summary: Discover Models From Providers
      description: Fetch active providers' model inventories without mutating the registry.
      operationId: discover_models_from_providers_app_v1_models_discover_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDiscoveryResponse'
      security:
      - HTTPBearer: []
  /app/v1/models/sync-pricing:
    post:
      tags:
      - Registry
      summary: Sync Model Pricing All
      description: Sync pricing for all models from the database to the billing provider.
      operationId: sync_model_pricing_all_app_v1_models_sync_pricing_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /app/v1/models/sync-provider-fields:
    post:
      tags:
      - Registry
      summary: Sync Provider Model Fields
      description: Refresh normalized provider /models fields for existing deployments.
      operationId: sync_provider_model_fields_app_v1_models_sync_provider_fields_post
      security:
      - HTTPBearer: []
      parameters:
      - name: provider_name
        in: query
        required: false
        schema:
          type: string
          default: openrouter
          title: Provider Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderModelSyncResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/models:
    get:
      tags:
      - Registry
      summary: Get All Models
      description: Get all Arcee AI models from the database.
      operationId: get_all_models_app_v1_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ModelResponse'
                type: array
                title: Response Get All Models App V1 Models Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - Registry
      summary: Create Model
      description: Create a new Arcee AI model in the database.
      operationId: create_model_app_v1_models_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /app/v1/models/{model_id}:
    get:
      tags:
      - Registry
      summary: Get Model
      description: Get a single Arcee AI model by ID from the database.
      operationId: get_model_app_v1_models__model_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          title: Model Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/models/{id}:
    put:
      tags:
      - Registry
      summary: Update Model
      description: Update a single Arcee AI model in the database.
      operationId: update_model_app_v1_models__id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Registry
      summary: Delete Model
      description: 'Delete a single Arcee AI model from the database. Invalidates the

        LiteLLM router cache so all pods rebuild on their next request.'
      operationId: delete_model_app_v1_models__id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/model-providers:
    get:
      tags:
      - Registry
      summary: Get All Model Providers
      description: Get all model providers from the database.
      operationId: get_all_model_providers_app_v1_model_providers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ModelProviderResponse'
                type: array
                title: Response Get All Model Providers App V1 Model Providers Get
      security:
      - HTTPBearer: []
  /app/v1/model-providers/{provider_id}:
    patch:
      tags:
      - Registry
      summary: Update Model Provider
      description: 'Toggle a model provider''s is_active flag. Invalidates the router and

        provider-lookup caches so all pods pick up the change immediately.'
      operationId: update_model_provider_app_v1_model_providers__provider_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Provider Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelProviderActiveUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProviderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ModelTokenizerAssignmentResponse:
      properties:
        base_model_name:
          type: string
          title: Base Model Name
        tokenizer:
          $ref: '#/components/schemas/TokenizerArtifactResponse'
      type: object
      required:
      - base_model_name
      - tokenizer
      title: ModelTokenizerAssignmentResponse
    ProviderModelSyncResponse:
      properties:
        provider_name:
          type: string
          title: Provider Name
        discovered:
          type: integer
          title: Discovered
        matched:
          type: integer
          title: Matched
        updated:
          type: integer
          title: Updated
        unmatched_model_ids:
          items:
            type: string
          type: array
          title: Unmatched Model Ids
      type: object
      required:
      - provider_name
      - discovered
      - matched
      - updated
      title: ProviderModelSyncResponse
      description: Result of refreshing normalized fields for one provider's deployments.
    ModelUpdateRequest:
      properties:
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        base_model_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Model Name
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
        context_length:
          anyOf:
          - type: integer
          - type: 'null'
          title: Context Length
        status:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Status
        is_public:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Public
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
        is_app_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is App Enabled
        is_api_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Api Enabled
        pricing:
          anyOf:
          - $ref: '#/components/schemas/PricingModel'
          - type: 'null'
        provider_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Provider Id
        meta:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta
        canonical_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Canonical Slug
        hugging_face_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Hugging Face Id
        created:
          anyOf:
          - type: integer
          - type: 'null'
          title: Created
        architecture:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Architecture
        per_request_limits:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Per Request Limits
        supported_parameters:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Supported Parameters
        temperature:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: 0.0
          - type: 'null'
          title: Temperature
        top_p:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Top P
        top_k:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Top K
        min_p:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Min P
        frequency_penalty:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: -2.0
          - type: 'null'
          title: Frequency Penalty
        presence_penalty:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: -2.0
          - type: 'null'
          title: Presence Penalty
        repetition_penalty:
          anyOf:
          - type: number
          - type: 'null'
          title: Repetition Penalty
        max_tokens:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Max Tokens
        routing_weight:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Routing Weight
        routing_tier:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Routing Tier
        minimum_tps:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Minimum Tps
        maximum_ttft_seconds:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Maximum Ttft Seconds
        max_output_length:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Max Output Length
        supported_reasoning_efforts:
          anyOf:
          - items:
              type: string
              enum:
              - minimal
              - low
              - medium
              - high
              - xhigh
              - max
            type: array
          - type: 'null'
          title: Supported Reasoning Efforts
        reasoning_default_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Reasoning Default Enabled
        reasoning_default_effort:
          anyOf:
          - type: string
            enum:
            - minimal
            - low
            - medium
            - high
            - xhigh
            - max
          - type: 'null'
          title: Reasoning Default Effort
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      title: ModelUpdateRequest
      description: Request model for updating an Arcee AI model.
    DiscoveredProviderModel:
      properties:
        provider_id:
          type: string
          format: uuid
          title: Provider Id
        provider_name:
          type: string
          title: Provider Name
        provider_display_name:
          type: string
          title: Provider Display Name
        model_id:
          type: string
          title: Model Id
        maker:
          type: string
          title: Maker
        display_name:
          type: string
          title: Display Name
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
        context_length:
          anyOf:
          - type: integer
          - type: 'null'
          title: Context Length
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        canonical_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Canonical Slug
        hugging_face_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Hugging Face Id
        created:
          anyOf:
          - type: integer
          - type: 'null'
          title: Created
        architecture:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Architecture
        per_request_limits:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Per Request Limits
        supported_parameters:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Supported Parameters
        temperature:
          anyOf:
          - type: number
          - type: 'null'
          title: Temperature
        top_p:
          anyOf:
          - type: number
          - type: 'null'
          title: Top P
        top_k:
          anyOf:
          - type: integer
          - type: 'null'
          title: Top K
        frequency_penalty:
          anyOf:
          - type: number
          - type: 'null'
          title: Frequency Penalty
        presence_penalty:
          anyOf:
          - type: number
          - type: 'null'
          title: Presence Penalty
        repetition_penalty:
          anyOf:
          - type: number
          - type: 'null'
          title: Repetition Penalty
        supported_reasoning_efforts:
          anyOf:
          - items:
              type: string
              enum:
              - minimal
              - low
              - medium
              - high
              - xhigh
              - max
            type: array
          - type: 'null'
          title: Supported Reasoning Efforts
        reasoning_default_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Reasoning Default Enabled
        reasoning_default_effort:
          anyOf:
          - type: string
            enum:
            - minimal
            - low
            - medium
            - high
            - xhigh
            - max
          - type: 'null'
          title: Reasoning Default Effort
        already_imported:
          type: boolean
          title: Already Imported
          default: false
      type: object
      required:
      - provider_id
      - provider_name
      - provider_display_name
      - model_id
      - maker
      - display_name
      title: DiscoveredProviderModel
      description: One selectable upstream deployment returned by a provider's /models API.
    ModelTokenizerAssignmentRequest:
      properties:
        base_model_name:
          type: string
          minLength: 1
          title: Base Model Name
        tokenizer_artifact_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Tokenizer Artifact Id
      type: object
      required:
      - base_model_name
      title: ModelTokenizerAssignmentRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TokenizerArtifactFile:
      properties:
        path:
          type: string
          minLength: 1
          title: Path
        sha256:
          type: string
          maxLength: 64
          minLength: 64
          title: Sha256
        size:
          type: integer
          minimum: 0.0
          title: Size
      type: object
      required:
      - path
      - sha256
      - size
      title: TokenizerArtifactFile
    PricingModel:
      properties:
        input:
          anyOf:
          - type: number
          - type: 'null'
          title: Input
        cached_input:
          anyOf:
          - type: number
          - type: 'null'
          title: Cached Input
        output:
          anyOf:
          - type: number
          - type: 'null'
          title: Output
      type: object
      title: PricingModel
      description: Pricing information for a model.
    ModelProviderResponse:
      properties:
        name:
          type: string
          title: Name
        display_name:
          type: string
          title: Display Name
        base_url:
          type: string
          title: Base Url
        api_key_env_var:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Key Env Var
        priority:
          type: integer
          title: Priority
          default: 100
        is_active:
          type: boolean
          title: Is Active
          default: true
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        meta:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta
      type: object
      required:
      - name
      - display_name
      - base_url
      - id
      - created_at
      title: ModelProviderResponse
    ModelCreateRequest:
      properties:
        id:
          type: string
          title: Id
        base_model_name:
          type: string
          minLength: 1
          title: Base Model Name
        display_name:
          type: string
          title: Display Name
        organization:
          anyOf:
          - type: string
          - type: 'null'
          title: Organization
          default: Arcee AI
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
        context_length:
          anyOf:
          - type: integer
          - type: 'null'
          title: Context Length
        status:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Status
          default: true
        is_public:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Public
          default: false
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
          default: true
        is_app_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is App Enabled
          default: false
        is_api_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Api Enabled
          default: false
        pricing:
          anyOf:
          - $ref: '#/components/schemas/PricingModel'
          - type: 'null'
          default: {}
        model_provider_id:
          type: string
          format: uuid
          title: Model Provider Id
        meta:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta
        canonical_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Canonical Slug
        hugging_face_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Hugging Face Id
        created:
          anyOf:
          - type: integer
          - type: 'null'
          title: Created
        architecture:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Architecture
        per_request_limits:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Per Request Limits
        supported_parameters:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Supported Parameters
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        temperature:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: 0.0
          - type: 'null'
          title: Temperature
        top_p:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Top P
        top_k:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Top K
        min_p:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Min P
        frequency_penalty:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: -2.0
          - type: 'null'
          title: Frequency Penalty
        presence_penalty:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: -2.0
          - type: 'null'
          title: Presence Penalty
        repetition_penalty:
          anyOf:
          - type: number
          - type: 'null'
          title: Repetition Penalty
        max_tokens:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Max Tokens
        routing_weight:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Routing Weight
        routing_tier:
          type: integer
          minimum: 0.0
          title: Routing Tier
          default: 0
        minimum_tps:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Minimum Tps
        maximum_ttft_seconds:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Maximum Ttft Seconds
