        assets:
          $ref: '#/components/schemas/SignupCampaignAssets'
        colors:
          $ref: '#/components/schemas/SignupCampaignColors'
        additional_css:
          anyOf:
          - type: string
          - type: 'null'
          title: Additional Css
        background_assets:
          anyOf:
          - type: string
          - type: 'null'
          title: Background Assets
        partner_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Partner Url
        enabled:
          type: boolean
          title: Enabled
        meta:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta
        report_enabled:
          type: boolean
          title: Report Enabled
        report_emails:
          type: string
