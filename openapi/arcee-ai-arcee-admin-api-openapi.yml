openapi: 3.2.0
info:
  title: AFM Arcee Admin API
  version: 0.1.0
tags:
- name: Arcee-Admin
paths:
  /app/v1/waitlist-status:
    get:
      tags:
      - Arcee-Admin
      summary: Get Waitlist Status
      operationId: get_waitlist_status_app_v1_waitlist_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /app/v1/waitlist-status/{status}:
    post:
      tags:
      - Arcee-Admin
      summary: Set Waitlist Status
      operationId: set_waitlist_status_app_v1_waitlist_status__status__post
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: path
        required: true
        schema:
          type: boolean
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/join-waitlist:
    post:
      tags:
      - Arcee-Admin
      summary: Join Waitlist
      operationId: join_waitlist_app_v1_join_waitlist_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinWaitlistRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/waitlist:
    get:
      tags:
      - Arcee-Admin
      summary: Get Waitlist Entries
      operationId: get_waitlist_entries_app_v1_waitlist_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Page Size
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWaitlistResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Arcee-Admin
      summary: Update Waitlist Entry Status
      operationId: update_waitlist_entry_status_app_v1_waitlist_patch
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWaitlistEntryStatusRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WaitlistEntryResponse'
                - type: 'null'
                title: Response Update Waitlist Entry Status App V1 Waitlist Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/responses/connections:
    get:
      tags:
      - Arcee-Admin
      summary: Get Responses Connections
      description: 'Live Responses WebSocket connections across every pod.


        Read-only. Each pod publishes its own connections on a heartbeat; this

        merges them. `heartbeat_seconds` is returned so callers can poll at the

        publish cadence instead of hardcoding it — polling faster only re-reads the

        same blob.'
      operationId: get_responses_connections_app_v1_responses_connections_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Responses Connections App V1 Responses Connections Get
      security:
      - HTTPBearer: []
  /app/v1/app-settings:
    get:
      tags:
      - Arcee-Admin
      summary: Get App Settings
      operationId: get_app_settings_app_v1_app_settings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get App Settings App V1 App Settings Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - Arcee-Admin
      summary: Toggle App Setting
      operationId: toggle_app_setting_app_v1_app_settings_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleAppSettingRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /app/v1/app-settings/text:
    post:
      tags:
      - Arcee-Admin
      summary: Update Text Setting
      operationId: update_text_setting_app_v1_app_settings_text_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTextSettingRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /app/v1/app-settings/int:
    post:
      tags:
      - Arcee-Admin
      summary: Update Int Setting
      operationId: update_int_setting_app_v1_app_settings_int_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntSettingRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /app/v1/app-settings/banner:
    put:
      tags:
      - Arcee-Admin
      summary: Update Banner Settings
      operationId: update_banner_settings_app_v1_app_settings_banner_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBannerSettingsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /app/v1/app-settings/signup-slack-report:
    put:
      tags:
      - Arcee-Admin
      summary: Update Signup Slack Report Settings
      operationId: update_signup_slack_report_settings_app_v1_app_settings_signup_slack_report_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSignupSlackReportSettingsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /app/v1/app-settings/completion:
    put:
      tags:
      - Arcee-Admin
      summary: Update Completion Settings
      operationId: update_completion_settings_app_v1_app_settings_completion_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompletionSettingsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /app/v1/tools:
    get:
      tags:
      - Arcee-Admin
      summary: Get Available Tools
      operationId: get_available_tools_app_v1_tools_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ToolInfoResponse'
                type: array
                title: Response Get Available Tools App V1 Tools Get
      security:
      - HTTPBearer: []
  /app/v1/flagged-responses:
    get:
      tags:
      - Arcee-Admin
      summary: Get Flagged Responses
      operationId: get_flagged_responses_app_v1_flagged_responses_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Page Size
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFlaggedResponsesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/flagged-responses/{flagged_id}:
    get:
      tags:
      - Arcee-Admin
      summary: Get Flagged Response
      operationId: get_flagged_response_app_v1_flagged_responses__flagged_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: flagged_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Flagged Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlaggedResponseEntry'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Arcee-Admin
      summary: Delete Flagged Response
      operationId: delete_flagged_response_app_v1_flagged_responses__flagged_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: flagged_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Flagged Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Arcee-Admin
      summary: Update Flagged Response Status
      operationId: update_flagged_response_status_app_v1_flagged_responses__flagged_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: flagged_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Flagged Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFlaggedResponseStatusRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/flagged-responses/{flagged_id}/messages:
    get:
      tags:
      - Arcee-Admin
      summary: Get Flagged Response Messages
      operationId: get_flagged_response_messages_app_v1_flagged_responses__flagged_id__messages_get
      security:
      - HTTPBearer: []
      parameters:
      - name: flagged_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Flagged Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminChatMessageResponse'
                title: Response Get Flagged Response Messages App V1 Flagged Responses  Flagged Id  Messages Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/arcee-admin/aws-marketplace/subscriptions:
    get:
      tags:
      - Arcee-Admin
      summary: Get Aws Marketplace Subscriptions
      operationId: get_aws_marketplace_subscriptions_app_v1_arcee_admin_aws_marketplace_subscriptions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Page Size
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAWSMarketplaceSubscriptionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/arcee-admin/aws-marketplace/reviews:
    get:
      tags:
      - Arcee-Admin
      summary: Get Aws Marketplace Billing Reviews
      operationId: get_aws_marketplace_billing_reviews_app_v1_arcee_admin_aws_marketplace_reviews_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Page Size
      - name: review_status
        in: query
        required: false
        schema:
          type: string
          default: pending_review
          title: Review Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAWSMarketplaceBillingReviewsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/arcee-admin/aws-marketplace/reviews/{review_id}:
    patch:
      tags:
      - Arcee-Admin
      summary: Update Aws Marketplace Billing Review
      operationId: update_aws_marketplace_billing_review_app_v1_arcee_admin_aws_marketplace_reviews__review_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: review_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Review Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAWSMarketplaceBillingReviewRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/toggle-free-key:
    post:
      tags:
      - Arcee-Admin
      summary: Toggle Free Key
      operationId: toggle_free_key_app_v1_toggle_free_key_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleFreeKeyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    UpdateTextSettingRequest:
      properties:
        setting_name:
          type: string
          title: Setting Name
        new_value:
          type: string
          title: New Value
      type: object
      required:
      - setting_name
      - new_value
      title: UpdateTextSettingRequest
    UpdateBannerSettingsRequest:
      properties:
        show_banner:
          type: boolean
          title: Show Banner
        title:
          type: string
          maxLength: 200
          title: Title
        description:
          type: string
          maxLength: 500
          title: Description
        banner_url:
          type: string
          maxLength: 2048
          title: Banner Url
      type: object
      required:
      - show_banner
      - title
      - description
      - banner_url
      title: UpdateBannerSettingsRequest
    FlaggedResponseEntry:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        chat_message_id:
          type: string
          format: uuid
          title: Chat Message Id
        chat_session_id:
          type: string
          format: uuid
          title: Chat Session Id
        user_org_profile_id:
          type: string
          format: uuid
          title: User Org Profile Id
        reason:
          type: string
          title: Reason
        user_feedback:
          anyOf:
          - type: string
          - type: 'null'
          title: User Feedback
        created_at:
          type: string
          title: Created At
        meta:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta
        admin_review:
          type: string
          title: Admin Review
      type: object
      required:
      - id
      - chat_message_id
      - chat_session_id
      - user_org_profile_id
      - reason
      - created_at
      - admin_review
      title: FlaggedResponseEntry
    UpdateFlaggedResponseStatusRequest:
      properties:
        admin_review:
          type: string
          title: Admin Review
      type: object
      required:
      - admin_review
      title: UpdateFlaggedResponseStatusRequest
    ToggleAppSettingRequest:
      properties:
        setting_name:
          type: string
          title: Setting Name
        new_value:
          type: boolean
          title: New Value
      type: object
      required:
      - setting_name
      - new_value
      title: ToggleAppSettingRequest
    UpdateIntSettingRequest:
      properties:
        setting_name:
          type: string
          title: Setting Name
        new_value:
          type: integer
          title: New Value
      type: object
      required:
      - setting_name
      - new_value
      title: UpdateIntSettingRequest
    AWSMarketplaceSubscriptionEntry:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        organization_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Organization Id
        organization_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Organization Name
        aws_customer_id:
          type: string
          title: Aws Customer Id
        aws_product_code:
          type: string
          title: Aws Product Code
        aws_license_arn:
          anyOf:
          - type: string
          - type: 'null'
          title: Aws License Arn
        aws_agreement_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Aws Agreement Id
        entitlement_dimension:
          anyOf:
          - type: string
          - type: 'null'
          title: Entitlement Dimension
        entitlement_quantity:
          anyOf:
          - type: integer
          - type: 'null'
          title: Entitlement Quantity
        granted_credit_amount_cents:
          type: integer
          title: Granted Credit Amount Cents
        credit_expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Credit Expires At
        granted_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Granted At
        last_entitlement_checked_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Entitlement Checked At
        status:
          type: string
          title: Status
        linked_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Linked At
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - id
      - aws_customer_id
      - aws_product_code
      - granted_credit_amount_cents
      - status
      - created_at
      - updated_at
      title: AWSMarketplaceSubscriptionEntry
    JoinWaitlistRequest:
      properties:
        email:
          type: string
          title: Email
      type: object
      required:
      - email
      title: JoinWaitlistRequest
    UpdateWaitlistEntryStatusRequest:
      properties:
        entry_id:
          type: string
          title: Entry Id
        email:
          type: string
          title: Email
        new_status:
          $ref: '#/components/schemas/WaitlistStatus'
      type: object
      required:
      - entry_id
      - email
      - new_status
      title: UpdateWaitlistEntryStatusRequest
    PaginatedAWSMarketplaceBillingReviewsResponse:
      properties:
        entries:
          items:
            $ref: '#/components/schemas/AWSMarketplaceBillingReviewEntry'
          type: array
          title: Entries
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        page_size:
          type: integer
          title: Page Size
        total_pages:
          type: integer
          title: Total Pages
        has_next:
          type: boolean
          title: Has Next
        has_prev:
          type: boolean
          title: Has Prev
      type: object
      required:
      - entries
      - total
      - page
      - page_size
      - total_pages
      - has_next
      - has_prev
      title: PaginatedAWSMarketplaceBillingReviewsResponse
    WaitlistStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
      - completed
      title: WaitlistStatus
    PaginatedAWSMarketplaceSubscriptionsResponse:
      properties:
        entries:
          items:
            $ref: '#/components/schemas/AWSMarketplaceSubscriptionEntry'
          type: array
          title: Entries
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        page_size:
          type: integer
          title: Page Size
        total_pages:
          type: integer
          title: Total Pages
        has_next:
          type: boolean
          title: Has Next
        has_prev:
          type: boolean
          title: Has Prev
      type: object
      required:
      - entries
      - total
      - page
      - page_size
      - total_pages
      - has_next
      - has_prev
      title: PaginatedAWSMarketplaceSubscriptionsResponse
    PaginatedWaitlistResponse:
      properties:
        entries:
          items:
            $ref: '#/components/schemas/WaitlistEntryResponse'
          type: array
          title: Entries
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        page_size:
          type: integer
          title: Page Size
        total_pages:
          type: integer
          title: Total Pages
        has_next:
          type: boolean
          title: Has Next
        has_prev:
          type: boolean
          title: Has Prev
      type: object
      required:
      - entries
      - total
      - page
      - page_size
      - total_pages
      - has_next
      - has_prev
      title: PaginatedWaitlistResponse
    PaginatedFlaggedResponsesResponse:
      properties:
        entries:
          items:
            $ref: '#/components/schemas/FlaggedResponseEntry'
          type: array
          title: Entries
        total:
          type: integer
          title: Total
