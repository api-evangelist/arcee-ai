openapi: 3.2.0
info:
  title: AFM Device Auth API
  version: 0.1.0
tags:
- name: Device Auth
paths:
  /app/v1/device/code:
    post:
      tags:
      - Device Auth
      summary: Create Device Code
      description: 'Start a device authorization: issue a device_code + human user_code.'
      operationId: create_device_code_app_v1_device_code_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCodeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCodeResponse'
        '400':
          description: OAuth-style error (e.g. authorization_pending, slow_down, access_denied).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/device/token:
    post:
      tags:
      - Device Auth
      summary: Poll Device Token
      description: Poll for the authorization result. Returns access + refresh tokens once approved.
      operationId: poll_device_token_app_v1_device_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenSuccess'
        '400':
          description: OAuth-style error (e.g. authorization_pending, slow_down, access_denied).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/device/refresh:
    post:
      tags:
      - Device Auth
      summary: Refresh Device Token
      description: Exchange a refresh token for a new short-lived access token.
      operationId: refresh_device_token_app_v1_device_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRefreshResponse'
        '400':
          description: OAuth-style error (e.g. authorization_pending, slow_down, access_denied).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/device/info:
    get:
      tags:
      - Device Auth
      summary: Device Info
      description: Return the requesting client's display name + status for the consent screen.
      operationId: device_info_app_v1_device_info_get
      security:
      - HTTPBearer: []
      parameters:
      - name: user_code
        in: query
        required: true
        schema:
          type: string
          title: User Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/device/approve:
    post:
      tags:
      - Device Auth
      summary: Approve Device
      description: 'Approve a device authorization: mint an access/refresh grant scoped to the chosen workspace.'
      operationId: approve_device_app_v1_device_approve_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceApproveRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceApproveResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /app/v1/device/deny:
    post:
      tags:
      - Device Auth
      summary: Deny Device
      description: Deny a device authorization so the polling client stops with access_denied.
      operationId: deny_device_app_v1_device_deny_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceDenyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDenyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /app/v1/device/grants:
    get:
      tags:
      - Device Auth
      summary: List Connected Apps
      description: 'List live device-auth grants: the caller''s own, or a whole workspace''s (admin/owner).'
      operationId: list_connected_apps_app_v1_device_grants_get
      security:
      - HTTPBearer: []
      parameters:
      - name: organization_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Workspace to list clients for (admin/owner only). Omit for the caller's own grants.
          title: Organization Id
        description: Workspace to list clients for (admin/owner only). Omit for the caller's own grants.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectedAppGrant'
                title: Response List Connected Apps App V1 Device Grants Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/device/grants/{grant_id}/revoke:
    post:
      tags:
      - Device Auth
      summary: Revoke Connected App
      description: Revoke one of the current user's grants; the token stops working within seconds.
      operationId: revoke_connected_app_app_v1_device_grants__grant_id__revoke_post
      security:
      - HTTPBearer: []
      parameters:
      - name: grant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Grant Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ConnectedAppGrant:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        client_id:
          type: string
          title: Client Id
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        token_suffix:
          anyOf:
          - type: string
          - type: 'null'
          title: Token Suffix
        organization_id:
          type: string
          format: uuid
          title: Organization Id
        workspace_name:
          type: string
          title: Workspace Name
        authorized_by_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorized By Email
        authorized_by_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorized By Name
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        last_used_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Used At
        is_valid:
          type: boolean
          title: Is Valid
      type: object
      required:
      - id
      - client_id
      - organization_id
      - workspace_name
      - is_valid
      title: ConnectedAppGrant
      description: A live device-auth grant, shown on the Connected apps / authorized clients UI.
    DeviceInfoResponse:
      properties:
        client_id:
          type: string
          title: Client Id
        client_display_name:
          type: string
          title: Client Display Name
        status:
          type: string
          title: Status
        expires_in:
          type: integer
          title: Expires In
      type: object
      required:
      - client_id
      - client_display_name
      - status
      - expires_in
      title: DeviceInfoResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    DeviceCodeResponse:
      properties:
        device_code:
          type: string
          title: Device Code
        user_code:
          type: string
          title: User Code
        verification_uri:
          type: string
          title: Verification Uri
        verification_uri_complete:
          type: string
          title: Verification Uri Complete
        interval:
          type: integer
          title: Interval
        expires_in:
          type: integer
          title: Expires In
      type: object
      required:
      - device_code
      - user_code
      - verification_uri
      - verification_uri_complete
      - interval
      - expires_in
      title: DeviceCodeResponse
    DeviceCodeRequest:
      properties:
        client_id:
          type: string
          title: Client Id
      type: object
      required:
      - client_id
      title: DeviceCodeRequest
    DeviceRefreshRequest:
      properties:
        refresh_token:
          type: string
          title: Refresh Token
        client_id:
          type: string
          title: Client Id
      type: object
      required:
      - refresh_token
      - client_id
      title: DeviceRefreshRequest
    DeviceTokenRequest:
      properties:
        device_code:
          type: string
          title: Device Code
        client_id:
          type: string
          title: Client Id
      type: object
      required:
      - device_code
      - client_id
      title: DeviceTokenRequest
    DeviceApproveResponse:
      properties:
        status:
          type: string
          title: Status
          default: approved
        workspace_name:
          type: string
          title: Workspace Name
        organization_id:
          type: string
          format: uuid
          title: Organization Id
      type: object
      required:
      - workspace_name
      - organization_id
      title: DeviceApproveResponse
    DeviceRefreshResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
      type: object
      required:
      - access_token
      - refresh_token
      - expires_in
      title: DeviceRefreshResponse
    DeviceAuthErrorResponse:
      properties:
        error:
          type: string
          title: Error
        error_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Description
      type: object
      required:
      - error
      title: DeviceAuthErrorResponse
      description: 'RFC 8628 OAuth-style error body returned (with HTTP 400) by the

        unauthenticated device endpoints.'
    DeviceDenyResponse:
      properties:
        status:
          type: string
          title: Status
          default: denied
      type: object
      title: DeviceDenyResponse
    DeviceTokenSuccess:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
        base_url:
          type: string
          title: Base Url
        organization_id:
          type: string
          format: uuid
          title: Organization Id
        workspace_name:
          type: string
          title: Workspace Name
      type: object
      required:
      - access_token
      - refresh_token
      - expires_in
      - base_url
      - organization_id
      - workspace_name
      title: DeviceTokenSuccess
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    DeviceDenyRequest:
      properties:
        user_code:
          type: string
          title: User Code
      type: object
      required:
      - user_code
      title: DeviceDenyRequest
    DeviceApproveRequest:
      properties:
        user_code:
          type: string
          title: User Code
        organization_id:
          type: string
          format: uuid
          title: Organization Id
      type: object
      required:
      - user_code
      - organization_id
      title: DeviceApproveRequest
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
x-provenance:
  method: harvested
  publisher: Arcee AI
  source: https://api.arcee.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
