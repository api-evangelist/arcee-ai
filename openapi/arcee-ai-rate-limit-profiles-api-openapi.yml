          title: Requests Per Month
        tokens_per_minute:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tokens Per Minute
        tokens_per_week:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tokens Per Week
        tokens_per_day:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tokens Per Day
        tokens_per_month:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tokens Per Month
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        meta:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta
        is_default:
          anyOf:
          - type: boolean
