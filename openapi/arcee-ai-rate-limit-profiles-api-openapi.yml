          title: Name
        requests_per_minute:
          anyOf:
          - type: integer
          - type: 'null'
          title: Requests Per Minute
        requests_per_day:
          anyOf:
          - type: integer
          - type: 'null'
          title: Requests Per Day
        requests_per_week:
          anyOf:
          - type: integer
          - type: 'null'
          title: Requests Per Week
        requests_per_month:
          anyOf:
          - type: integer
          - type: 'null'
          title: Requests Per Month
        tokens_per_minute:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tokens Per Minute
        tokens_per_week:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tokens Per Week
        tokens_per_day:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tokens Per Day
        tokens_per_month:
          anyOf:
          - type: integer
