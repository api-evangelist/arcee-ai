openapi: 3.2.0
info:
  title: AFM Billing API
  version: 0.1.0
tags:
- name: Billing
paths:
  /app/v1/billing:
    get:
      tags:
      - Billing
      summary: Get Customer Billing Data
      description: 'Get customer billing data.

        Uses primary DB to ensure immediate consistency (e.g., seeing newly added payment methods).'
      operationId: get_customer_billing_data_app_v1_billing_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /app/v1/billing/invoices:
    get:
      tags:
      - Billing
      summary: List Billing Invoices
      description: 'List finalized invoices for the active organization, newest first.

        Uses primary DB to match the other billing reads.'
      operationId: list_billing_invoices_app_v1_billing_invoices_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /app/v1/billing/promotions/nac-launch:
    post:
      tags:
      - Billing
      summary: Grant Nac Launch Promotion
      operationId: grant_nac_launch_promotion_app_v1_billing_promotions_nac_launch_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /app/v1/billing/link:
    get:
      tags:
      - Billing
      summary: Get Billing Link
      description: 'Get billing portal link.

        Uses primary DB to ensure immediate consistency.'
      operationId: get_billing_link_app_v1_billing_link_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /app/v1/billing/topup:
    post:
      tags:
      - Billing
      summary: Top Up Wallet
      operationId: top_up_wallet_app_v1_billing_topup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopUpRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /app/v1/billing/auto-topup:
    put:
      tags:
      - Billing
      summary: Update Topup
      operationId: update_topup_app_v1_billing_auto_topup_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTopUpRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TopUpRequest:
      properties:
        amount:
          type: string
          title: Amount
        idempotency_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency Key
      type: object
      required:
      - amount
      title: TopUpRequest
    UpdateTopUpRequest:
      properties:
        enableAutoTopUp:
          type: boolean
          title: Enableautotopup
        topUpAmount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Topupamount
        topUpThreshold:
          anyOf:
          - type: integer
          - type: 'null'
          title: Topupthreshold
      type: object
      required:
      - enableAutoTopUp
      title: UpdateTopUpRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
x-provenance:
  method: harvested
  publisher: Arcee AI
  source: https://api.arcee.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
