openapi: 3.2.0
info:
  title: AFM Dev Mode API
  version: 0.1.0
tags:
- name: Dev Mode
paths:
  /app/v1/dev-mode/chat/completions:
    post:
      tags:
      - Dev Mode
      summary: Dev Chat Completion
      description: Dev mode chat completion endpoint (user-auth, no API key).
      operationId: dev_chat_completion_app_v1_dev_mode_chat_completions_post
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Existing dev session ID; creates new if omitted
          title: Session Id
        description: Existing dev session ID; creates new if omitted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '402':
          description: Insufficient credits
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/dev-mode/sessions:
    get:
      tags:
      - Dev Mode
      summary: Dev List Sessions
      description: List dev sessions for current user.
      operationId: dev_list_sessions_app_v1_dev_mode_sessions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: from_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From Date
      - name: to_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To Date
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/dev-mode/sessions/{session_id}:
    get:
      tags:
      - Dev Mode
      summary: Dev Get Session
      description: Get dev session with messages.
      operationId: dev_get_session_app_v1_dev_mode_sessions__session_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Dev Mode
      summary: Dev Update Session Title
      description: Update dev session title.
      operationId: dev_update_session_title_app_v1_dev_mode_sessions__session_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevSessionUpdateTitle'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Dev Mode
      summary: Dev Delete Session
      description: Delete dev session and its messages.
      operationId: dev_delete_session_app_v1_dev_mode_sessions__session_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /app/v1/dev-mode/sessions/{session_id}/messages:
    get:
      tags:
      - Dev Mode
      summary: Dev List Messages
      description: List messages in a dev session.
      operationId: dev_list_messages_app_v1_dev_mode_sessions__session_id__messages_get
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DevSessionUpdateTitle:
      properties:
        title:
          type: string
          title: Title
      type: object
      required:
      - title
      title: DevSessionUpdateTitle
      description: Request body for updating dev session title.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ChatCompletionRequest:
      properties:
        model:
          type: string
          minLength: 1
          title: Model
        messages:
          items: {}
          type: array
          minItems: 1
          title: Messages
        stream:
          type: boolean
          title: Stream
          default: false
        temperature:
          title: Temperature
        top_p:
          title: Top P
        top_k:
          title: Top K
        min_p:
          title: Min P
        n:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: N
          description: Kept structural because response accounting requires the expected choice count.
        stop:
          title: Stop
        seed:
          title: Seed
        max_tokens:
          title: Max Tokens
        max_completion_tokens:
          title: Max Completion Tokens
        presence_penalty:
          title: Presence Penalty
        frequency_penalty:
          title: Frequency Penalty
        logit_bias:
          title: Logit Bias
        logprobs:
          title: Logprobs
        top_logprobs:
          title: Top Logprobs
        tools:
          title: Tools
        tool_choice:
          title: Tool Choice
        parallel_tool_calls:
          title: Parallel Tool Calls
        functions:
          title: Functions
        function_call:
          title: Function Call
        reasoning_effort:
          title: Reasoning Effort
        reasoning:
          title: Reasoning
        response_format:
          title: Response Format
        stream_options:
          title: Stream Options
        user:
          title: User
        metadata:
          title: Metadata
        cache_control:
          title: Cache Control
        image_config:
          title: Image Config
        modalities:
          title: Modalities
        prediction:
          title: Prediction
        prompt_cache_key:
          title: Prompt Cache Key
        prompt_cache_options:
          title: Prompt Cache Options
        repetition_penalty:
          title: Repetition Penalty
        top_a:
          title: Top A
        trace:
          title: Trace
      additionalProperties: false
      type: object
      required:
      - model
      - messages
      title: ChatCompletionRequest
      description: 'Supported public OpenAI-compatible request fields.


        This is deliberately a positive allowlist. LiteLLM mixes user-facing

        fields with credentials, URLs, retry knobs, fallback controls, and testing

        hooks in one loose kwargs surface; accepting arbitrary extras would let a

        caller take ownership of server-side routing and transport policy. Values

        inside the safe inference allowlist intentionally remain untyped so the

        selected provider owns request validation.'
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
