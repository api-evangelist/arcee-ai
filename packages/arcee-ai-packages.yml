notes: >-
  The Arcee Platform inference API is OpenAI-compatible, so it is commonly consumed with the
  standard OpenAI SDKs (openai-python, openai-node) pointed at https://api.arcee.ai/api/v1 — those
  are third-party clients and are not listed here as official. arcee-py is Arcee's first-party
  Python SDK. Arcee also publishes widely used open-source model tooling (mergekit, DistillKit,
  DALM) which are training/merging tools rather than API client libraries.
