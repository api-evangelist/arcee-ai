aid: arcee-ai
name: Arcee AI
description: 'Arcee AI is an American open-intelligence research lab that builds and releases small,
  efficient open-weight language models (the Trinity family, AFM-4.5B, and Virtuoso/Maestro derivatives)
  along with a developer platform for running them. The Arcee Platform exposes an OpenAI-compatible
  inference API at api.arcee.ai (chat completions, model listing, and usage/credits endpoints) secured
  with bearer API keys, plus Arcee Conductor (model routing), Arcee Orchestra (agentic workflows with
  their own invocation API), and AnyMCP for hosting Model Context Protocol servers. Arcee also maintains
  widely used open-source model tooling including mergekit, DistillKit, and DALM. Models can be consumed
  through the hosted API or self-deployed on vLLM, SGLang, llama.cpp, and Ollama.'
